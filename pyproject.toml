[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-customer-intelligence"
version = "0.1.0"
description = "Customer and revenue analytics on UCI Online Retail II"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "openpyxl>=3.1,<4.0",
  "pyarrow>=15,<20",
  "scikit-learn>=1.5,<2.0",
  "matplotlib>=3.8,<4.0",
  "seaborn>=0.13,<1.0",
  "requests>=2.31,<3.0",
  "streamlit>=1.40,<2.0",
  "plotly>=5.24,<7.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
