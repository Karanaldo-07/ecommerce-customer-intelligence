name: Build analytics outputs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download official UCI dataset
        run: python scripts/download_data.py
      - name: Run data quality and customer analytics
        run: python scripts/run_analysis.py
      - name: Build privacy-conscious dashboard aggregates
        run: python scripts/build_public_dashboard_data.py
      - name: Commit aggregate dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data/
          if ! git diff --cached --quiet; then
            git commit -m "Publish refreshed aggregate dashboard data"
            git push
          fi
      - name: Upload generated reports and processed data
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-customer-intelligence-outputs
          path: |
            data/processed/
            reports/
            data/processed/*.joblib
          if-no-files-found: error
          retention-days: 14
